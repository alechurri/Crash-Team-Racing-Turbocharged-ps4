name: PS4 bug report
description: Report a problem with the PS4 port.
title: "[PS4]: "
body:
  - type: markdown
    attributes:
      value: |
        Before opening an issue, check the [troubleshooting table](https://github.com/alechurri/Crash-Team-Racing-Turbocharged-ps4/blob/ps4/INSTALL.md#troubleshooting). Problems that also happen on the PC version of Turbocharged belong upstream.
  - type: input
    id: version
    attributes:
      label: Port version
      description: The name of the `.pkg` you installed.
      placeholder: ctr-turbocharged-ps4-v0.1.2.pkg
    validations:
      required: true
  - type: input
    id: console
    attributes:
      label: Console and firmware
      placeholder: PS4 Pro, firmware 12.02, GoldHEN 2.4
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened
      description: What you did (mode, track, character, menu), what you expected, and what you saw (error code, freeze, wrong graphics...).
      placeholder: |
        1. Start the game...
        2. Select...
        3. The game closes with error CE-...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach `ps4.log`, `mesa.log` and `Crash Team Racing- Turbocharged.log` from `/data/ctr/` (copy them over FTP in binary mode before starting the game again; each start replaces them).
    validations:
      required: false
